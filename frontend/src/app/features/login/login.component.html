<div class="login-wrap">
  <div class="login-card">
    <img src="logo.png" alt="Amogha Gold Company" class="login-logo">
    <h1>Amogha Gold Company</h1>
    <p class="login-sub">Billing &amp; Transaction System</p>

    <label>Mobile Number</label>
    <input id="login_phone" type="tel" inputmode="numeric" maxlength="10" placeholder="e.g. 9999900001"
           [ngModel]="phone" (ngModelChange)="onPhone($event)" (keydown.enter)="login()">

    <label>Password</label>
    <input id="login_password" type="password" placeholder="Your password"
           [(ngModel)]="password" (keydown.enter)="login()">

    <button class="btn btn-gold btn-block" [disabled]="busy()" (click)="login()">
      <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>
    <p class="login-hint err">{{ error() }}</p>
  </div>
</div>
