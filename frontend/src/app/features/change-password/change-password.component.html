<div class="page-head">
  <div><h2>Change Password</h2><p>Update the password for your own login</p></div>
</div>

<div class="card" style="max-width:440px">
  <div class="field"><label>Current password</label>
    <input type="password" [(ngModel)]="current" (keydown.enter)="submit()" autocomplete="current-password"></div>
  <div class="field" style="margin-top:8px"><label>New password</label>
    <input type="password" [(ngModel)]="next" (keydown.enter)="submit()" autocomplete="new-password"></div>
  <div class="field" style="margin-top:8px"><label>Confirm new password</label>
    <input type="password" [(ngModel)]="confirm" (keydown.enter)="submit()" autocomplete="new-password"></div>
  <button class="btn btn-gold btn-block" style="margin-top:12px" [disabled]="busy()" (click)="submit()">
    <i class="fa-solid fa-key"></i> Change password
  </button>
</div>
